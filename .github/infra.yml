# Configuration for pyrlyn/ci's ci.yml, called from pipeline.yml (docs/config.md in
# pyrlyn/ci). Language CI stays in ci.yml; this file turns on the scans.
version: 1

codeql:
  # Swift is left out: CodeQL Swift needs a macOS runner, and codeql.runs-on is shared by
  # every language (ubuntu-latest), so swift init fails with a configuration error.
  languages: [actions, csharp, rust]

# Snyk stays off (pyrlyn/ci default).
snyk:
  enabled: false

# .NET (if any) is built and tested by the local ci.yml.
dotnet:
  enabled: false

