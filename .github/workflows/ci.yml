name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The shared pyrlyn/ci Rust workflow, pinned by commit: fmt once, then per host clippy and
  # check, then `just check` as the test step. `just check` is the repository's gate (fmt-check,
  # clippy --locked -D warnings, nextest), including the drift check of the committed C header
  # and C# bindings (scull-ffi/tests/bindings.rs, `just bindings-check`).
  # Rust, nextest and just come from mise.toml, so CI runs the pinned versions.
  rust:
    uses: pyrlyn/ci/.github/workflows/ci-rust.yml@c875cd763ad0c4abbd936e480be5752330d3b66b # main 2026-10-07
    # ci-rust cancels the whole run when a job fails (cancel-run-on-failure), which needs
    # `actions: write` on the calling job.
    permissions:
      contents: read
      actions: write
    with:
      # The same three hosts as before: macOS is Apple Silicon only; Windows is the second
      # host the core ships on. No Linux arm64 entry yet.
      matrix: >-
        [
        {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu"},
        {"os": "xcode-27", "target": "aarch64-apple-darwin"},
        {"os": "windows-latest", "target": "x86_64-pc-windows-msvc"}
        ]
      mise-install-args: rust cargo:cargo-nextest just
      # `just lint` flags: no --all-features, --locked.
      feature-args: ""
      clippy-args: --locked
      test-command: just check
      # nextest (inside `just check`) does not run doctests and the gate never did.
      doc-tests: false

  # The C ABI driven from C under ASan+UBSan and TSan (`just c-abi-test`). Repository-specific:
  # not part of the shared workflow. The Windows runner's cc has no sanitizer runtimes.
  c-abi:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # Ubuntu's kernel randomises mmap with more bits than the sanitizer
      # runtimes of the runner's compilers can map around.
      - if: runner.os == 'Linux'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: just c-abi-test

  # The C# core's tests run on every runner against the library built here; the renderer builds
  # everywhere and its Direct3D tests draw on WARP on Windows. The WinUI 3 shell builds only on
  # Windows. The .NET SDK is pinned in windows/global.json.
  csharp:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json
      - run: just windows-core-test
      - if: runner.os == 'Windows'
        run: just windows-app

  # The in-crate stale-table test returns early when target/ucd is empty, and
  # `just check` never calls this. The generator fills that cache from the
  # pinned Unicode files, then fails when tables.rs or the grapheme fixture differ.
  ucd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: just ucd-check

  # libFuzzer needs nightly. mise stays on 1.99; nightly is installed beside
  # it and selected only by `cargo +nightly` inside `just fuzz-smoke`.
  # Five seconds per target, not a multi-minute campaign.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: smoke
        run: just fuzz-smoke
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
