name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which runner the macOS jobs use: pyrlyn/ci's macos-runner action reads the MACOS_RUNNER
  # variable (unset or `hosted` = the hosted label, `xcode-27-local` = the dedicated Mac).
  macos-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.r.outputs.value }}
    steps:
      - id: r
        uses: pyrlyn/ci/.github/actions/macos-runner@4b5b5470544893cd515b88c751e92728341c6daa # main
        with:
          runner: ${{ vars.MACOS_RUNNER }}
          value: '["macos-latest"]'

  rust:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macOS is Apple Silicon only; Windows is the second host the core ships on.
        os: ${{ fromJSON(vars.MACOS_CI_DISABLED == 'true' && '["windows-latest", "ubuntu-latest"]' || '["macos-latest", "windows-latest", "ubuntu-latest"]') }}
    needs: macos-runner
    # MACOS_RUNNER (pyrlyn/ci macos-runner): unset/hosted = the hosted label, xcode-27-local = the dedicated Mac (fork PRs keep the hosted label)
    runs-on: ${{ startsWith(matrix.os, 'macos') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.macos-runner.outputs.value)[0] || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rust, nextest and just come from mise.toml, so CI runs the pinned versions.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: ./.github/actions/sccache
        with:
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          read-only: ${{ github.event_name == 'pull_request' }}
      # Includes the drift check of the committed C header and C# bindings
      # (scull-ffi/tests/bindings.rs, `just bindings-check`).
      # `just check` is fmt-check + lint + test; the test part runs in `build-tests` + `test`.
      - run: just fmt-check lint
      # The .NET SDK pinned in windows/global.json, for the C# core's tests.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json
      # The C# core is platform-neutral, so its tests run on every runner
      # against the library this job just built. The renderer builds on
      # every runner too; its Direct3D tests draw on WARP on Windows and
      # are skipped on the others.
      - name: tests skipped (SKIP_CI_TESTS)
        if: vars.SKIP_CI_TESTS == 'true' || env.SKIP_CI_TESTS == 'true'
        run: echo "::notice title=SKIP_CI_TESTS::tests skipped by SKIP_CI_TESTS"
      - if: vars.SKIP_CI_TESTS != 'true' && env.SKIP_CI_TESTS != 'true'
        run: just windows-core-test
      # The WinUI 3 shell builds only on Windows; nothing here runs it.
      - if: runner.os == 'Windows'
        run: just windows-app
      # Numbers from a shared CI VM: the table says so, and they show up in the run's summary.
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          just windows-bench
          cat target/windows-renderer-bench.md >> "$GITHUB_STEP_SUMMARY"
      # Ubuntu's kernel randomises mmap with more bits than the sanitizer
      # runtimes of the runner's compilers can map around.
      - if: runner.os == 'Linux'
        run: sudo sysctl vm.mmap_rnd_bits=28
      # The C ABI driven from C under ASan+UBSan and TSan. The Windows
      # runner's cc has no sanitizer runtimes.
      - if: >-
          (runner.os != 'Windows')
          && vars.SKIP_CI_TESTS != 'true' && env.SKIP_CI_TESTS != 'true'
        run: just c-abi-test

  # Workflow lint: jactionlint with .github/jactionlint.yaml and its baseline, the check the
  # pre-push hook (hk.pkl) runs. install_args installs only jactionlint, not the Rust toolchain;
  # its version matches mise.toml. shellcheck comes from the runner image.
  jactionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: github:jdx/jactionlint@2.0.2
      - run: jactionlint --color
  # Test binaries are built once per OS and archived; the `test` shards only download the
  # archive and run their partition. Archive and run share one runner OS and target.
  build-tests:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(vars.MACOS_CI_DISABLED == 'true' && '["windows-latest", "ubuntu-latest"]' || '["macos-latest", "windows-latest", "ubuntu-latest"]') }}
    needs: macos-runner
    # MACOS_RUNNER (pyrlyn/ci macos-runner): unset/hosted = the hosted label, xcode-27-local = the dedicated Mac (fork PRs keep the hosted label)
    runs-on: ${{ startsWith(matrix.os, 'macos') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.macos-runner.outputs.value)[0] || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: ./.github/actions/sccache
        with:
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          read-only: ${{ github.event_name == 'pull_request' }}
      - run: just test-archive
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive-${{ matrix.os }}
          path: nextest-archive.tar.zst
          if-no-files-found: error
          retention-days: 1

  test:
    timeout-minutes: 60
    needs: [build-tests, macos-runner]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(vars.MACOS_CI_DISABLED == 'true' && '["windows-latest", "ubuntu-latest"]' || '["macos-latest", "windows-latest", "ubuntu-latest"]') }}
        partition: [1, 2]
        partitions: [2]
    name: test (${{ matrix.os }}, ${{ matrix.partition }}/${{ matrix.partitions }})
    # MACOS_RUNNER (pyrlyn/ci macos-runner): unset/hosted = the hosted label, xcode-27-local = the dedicated Mac (fork PRs keep the hosted label)
    runs-on: ${{ startsWith(matrix.os, 'macos') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.macos-runner.outputs.value)[0] || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive-${{ matrix.os }}
      - name: tests skipped (SKIP_CI_TESTS)
        if: vars.SKIP_CI_TESTS == 'true' || env.SKIP_CI_TESTS == 'true'
        run: echo "::notice title=SKIP_CI_TESTS::tests skipped by SKIP_CI_TESTS"
      - if: vars.SKIP_CI_TESTS != 'true' && env.SKIP_CI_TESTS != 'true'
        run: just test-from-archive --partition count:${{ matrix.partition }}/${{ matrix.partitions }}

  # The in-crate stale-table test returns early when target/ucd is empty, and
  # `just check` never calls this. The generator fills that cache from the
  # pinned Unicode files, then fails when tables.rs or the grapheme fixture differ.
  ucd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: just ucd-check

  # Fails when workspace-hack drifts from the dependency graph (cargo-hakari
  # comes from mise.toml). Own job, so the required check names stay as they are.
  hakari:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: cargo hakari generate --diff
      - run: cargo hakari manage-deps --dry-run
      - run: cargo hakari verify

  # libFuzzer needs nightly. mise stays on 1.99; nightly is installed beside
  # it and selected only by `cargo +nightly` inside `just fuzz-smoke`.
  # Five seconds per target, not a multi-minute campaign.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: smoke
        run: just fuzz-smoke
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
