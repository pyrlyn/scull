name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        # macOS is Apple Silicon only; Windows is the second host the core ships on.
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Rust, nextest and just come from mise.toml, so CI runs the pinned versions.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # Includes the drift check of the committed C header and C# bindings
      # (scull-ffi/tests/bindings.rs, `just bindings-check`).
      - run: just check
      # The .NET SDK pinned in windows/global.json, for the C# core's tests.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json
      # The C# core is platform-neutral, so its tests run on every runner
      # against the library this job just built. The renderer builds on
      # every runner too; its Direct3D tests draw on WARP on Windows and
      # are skipped on the others.
      - run: just windows-core-test
      # Ubuntu's kernel randomises mmap with more bits than the sanitizer
      # runtimes of the runner's compilers can map around.
      - if: runner.os == 'Linux'
        run: sudo sysctl vm.mmap_rnd_bits=28
      # The C ABI driven from C under ASan+UBSan and TSan. The Windows
      # runner's cc has no sanitizer runtimes.
      - if: runner.os != 'Windows'
        run: just c-abi-test

  # The in-crate stale-table test returns early when target/ucd is empty, and
  # `just check` never calls this. The generator fills that cache from the
  # pinned Unicode files, then fails when tables.rs or the grapheme fixture differ.
  ucd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: just ucd-check

  # libFuzzer needs nightly. mise stays on 1.99; nightly is installed beside
  # it and selected only by `cargo +nightly` inside `just fuzz-smoke`.
  # Five seconds per target, not a multi-minute campaign.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: smoke
        run: just fuzz-smoke
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
