# Gated pipeline: pyrlyn/ci's config-driven ci.yml (configured in .github/infra.yml) runs
# CodeQL, Semgrep and actionlint behind `pipeline / gate`. Language CI stays in ci.yml.
# Draft pull requests skip every job, the gate included, until marked ready. Secrets are passed
# explicitly.
# Shared workflows: https://github.com/pyrlyn/ci/blob/main/docs/reusable-workflows.md
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # infra's config action on .github/infra.yml: `docs-only` is "true" when docs-only applies to
  # this event and every changed file is documentation (fails open: "false" when unsure).
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.config.outputs.docs-only }}
    steps:
      - id: config
        uses: pyrlyn/ci/.github/actions/config@main

  ci:
    needs: changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/ci.yml
    with:
      docs-only: ${{ needs.changes.outputs.docs-only == 'true' }}
    # ci.yml's jobs request these; a called workflow cannot exceed them.
    permissions:
      contents: read

  pipeline:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: pyrlyn/ci/.github/workflows/ci.yml@main
    # The union every nested job asks for, validated up front even for disabled checks.
    permissions:
      contents: read
      security-events: write
      pull-requests: read
      actions: write
      issues: write # pyrlyn/ci main-failure job (pyrlyn/ci#56)
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
