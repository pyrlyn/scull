[workspace]
members = ["crates/*", "tools/*"]
# cargo-fuzz is its own workspace (nightly). CI gates the in-crate corpus instead.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
# The pinned toolchain in mise.toml; nothing here needs an older compiler to
# keep working, so the MSRV follows the pin until a release promises otherwise.
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
scull-parser = { path = "crates/scull-parser" }
scull-unicode = { path = "crates/scull-unicode" }
scull-grid = { path = "crates/scull-grid" }
scull-term = { path = "crates/scull-term" }
scull-input = { path = "crates/scull-input" }
scull-pty = { path = "crates/scull-pty" }
scull-ffi = { path = "crates/scull-ffi" }
scull-harness = { path = "crates/scull-harness" }

# Error enums per library crate (rust.md: no anyhow below a binary).
thiserror = "2.0.21"
# Dependency-graph test in scull-ffi/tests/deps.rs.
cargo_metadata = "0.23.1"
# tools/scull-ucd-gen: download and verify the pinned Unicode data files.
anyhow = "1.0.104"
sha2 = "0.11.0"
ureq = "3.4.2"

# scull-parser: memchr3 finds the end of a DCS/APC payload in bulk.
memchr = "2.8.3"
# Property tests (parser chunking, unicode width bounds) and benches.
proptest = "1.11.0"
divan = "0.1.21"
# Baseline the parser bench is measured against.
vte = "0.15.0"

[workspace.lints.rust]
# Only the C ABI and the PTY need unsafe; those crates opt out with a reason.
unsafe_code = "deny"
missing_docs = "warn"
# `cargo fuzz` builds with `--cfg fuzzing`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Release archives only; ordinary --release stays fast to build.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
