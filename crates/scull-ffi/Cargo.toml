[package]
name = "scull-ffi"
description = "C ABI over the core: handles, frame snapshot, event queue, panic guard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Exports `tt_term_test_panic` so a host's tests can poison one terminal.
# Off in every shipped library; the header and bindings never list it.
test-hooks = []

[dependencies]
scull-config = { workspace = true }
scull-grid = { workspace = true }
scull-term = { workspace = true }
scull-input = { workspace = true }
scull-pty = { workspace = true }
percent-encoding = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
cbindgen = { workspace = true }
csbindgen = { workspace = true }
# Drift checks. Header generation stays on this crate's cbindgen 0.29.4
# (abi-drift's optional cbindgen is 0.29.3). csbindgen 1.9.8 matches, so the
# C# file goes through abi-drift. Default features stay off: they pull cbindgen.
abi-drift = { version = "0.1.0", default-features = false, features = ["csbindgen"] }
workspace-graph = { workspace = true }
