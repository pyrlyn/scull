# What tests/bindings.rs generates include/scull.h with.
language = "C"
include_guard = "SCULL_H"
header = """
/*
 * Copyright (c) 2026 Ivan Tugay
 * SPDX-License-Identifier: GPL-3.0-or-later
 *
 * Generated by cbindgen from crates/scull-ffi/src:
 * `just bindings`. Do not edit.
 */"""
trailer = """
/* The frame is read in place, so these layouts are the core's own. */
#ifdef __cplusplus
static_assert(sizeof(tt_cell) == 8, "tt_cell layout");
static_assert(sizeof(tt_run) == 16, "tt_run layout");
#else
_Static_assert(sizeof(tt_cell) == 8, "tt_cell layout");
_Static_assert(sizeof(tt_run) == 16, "tt_run layout");
#endif"""
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "both"
usize_is_size_t = true

[enum]
# The status values are named for C already (TT_OK, ...).
rename_variants = "None"

[export]
# Behind the `test-hooks` feature; a shipped library does not have it.
exclude = ["tt_term_test_panic"]
