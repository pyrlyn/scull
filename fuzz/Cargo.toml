[package]
name = "scull-fuzz"
description = "libFuzzer targets for the parser, the conformance stub and the image decoders"
version = "0.0.0"
# Own workspace, so this cannot inherit the root package table.
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
# Same resolved pin as apps/cox/fuzz. Nightly-only; CI runs the in-crate corpus.
libfuzzer-sys = "0.4.13"
scull-harness = { path = "../crates/scull-harness" }
scull-image = { path = "../crates/scull-image" }
scull-parser = { path = "../crates/scull-parser" }

[workspace]

[[bin]]
name = "stub_feed"
path = "fuzz_targets/stub_feed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "iterm"
path = "fuzz_targets/iterm.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sixel"
path = "fuzz_targets/sixel.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kitty"
path = "fuzz_targets/kitty.rs"
test = false
doc = false
bench = false
